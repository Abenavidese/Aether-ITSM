name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aether -d aether"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Test-only values; tests/conftest.py points the app at a throwaway SQLite DB.
      JWT_SECRET_KEY: ci-only-jwt-secret-key-0123456789abcdef
      SUPERADMIN_PASSWORD: ci-only-password
      ENCRYPTION_KEY: AnC_X1L-AJkDKcF9yc0V4ay0fhqzwjH4SqpXjPZVEIQ=
      PG_URL: postgresql://aether:aether@localhost:5432/aether
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy — src/agent, src/security)
        run: mypy

      - name: Tests (SQLite, scripted models)
        run: pytest -q

      - name: Migrations apply on Postgres and match the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python -m src.db.migrate
          alembic check

      - name: Row-Level Security tests (Postgres)
        env:
          RLS_TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest -q tests/test_rls_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type check + build (tsc -b && vite build)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API and web images
        run: |
          docker build -t aether-api .
          docker build -t aether-web frontend
