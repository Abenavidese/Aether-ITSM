# Schema migrations (roadmap 1.4). The database URL is NOT set here: it comes
# from the app's own settings (DATABASE_URL / .env), see migrations/env.py.
#
#   alembic upgrade head                        # apply everything
#   alembic revision --autogenerate -m "..."    # after changing src/db/models.py
#   python -m src.db.migrate                    # upgrade, adopting a pre-Alembic database
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
