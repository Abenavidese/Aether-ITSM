[project]
name = "aether-itsm"
version = "0.1.0"
description = "Multi-tenant agentic ITSM: LangGraph agents with deterministic guardrails"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["core-ecommerce-api", "frontend", "migrations/versions"]

[tool.ruff.lint]
# pyflakes + pycodestyle + import sorting + bugbear.
select = ["F", "E", "W", "I", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Header() in argument defaults is the framework's idiom
    "E501",  # prompts and regexes read better unwrapped; line-length only guides new code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # conftest sets env vars before importing src.*

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
# Report errors only in the files below; imported modules are analysed but not (yet) held to it.
follow_imports = "silent"
# Typed core first (roadmap 1.4): the agents, their LLM/prompt/tool layers, the security layer
# and the retrieval pipeline (Fase 14). The RAG modules that work on ORM rows
# (documents, router, insights, admin) join once the models move to Mapped[] types.
files = [
    "src/agents", "src/llm", "src/prompts", "src/tools", "src/core", "src/utils", "src/security",
    "src/rag/text.py", "src/rag/query.py", "src/rag/retrieval.py", "src/rag/rerank.py",
    "src/rag/citations.py", "src/rag/parsing.py", "src/rag/store.py", "src/rag/service.py",
    "src/rag/embeddings.py", "src/rag/chunking.py",
]

[tool.importlinter]
root_package = "src"
# Type-only imports (under TYPE_CHECKING) don't create runtime coupling.
exclude_type_checking_imports = true

# The backend's architecture, enforced in CI (`lint-imports`): a module may
# import from its own layer's package or any layer BELOW it, never above.
# Packages on one line separated by "|" are siblings that must not import
# each other either.
[[tool.importlinter.contracts]]
name = "Layered backend architecture"
type = "layers"
layers = [
    "src.main | src.worker",
    "src.api",
    "src.services",
    "src.agents",
    "src.tools | src.prompts | src.rag | src.integrations",
    "src.llm",
    "src.jobs | src.observability",
    "src.db | src.security",
    "src.core | src.utils",
]

